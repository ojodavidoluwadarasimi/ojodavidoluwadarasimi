name: Update GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate Profile Trophies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Trophy SVG
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: 'username=ojodavidoluwadarasimi&theme=onedark&column=4&margin-w=12&margin-h=12&no-frame=true'
          path: profile/trophy.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Commit Trophy Image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/trophy.svg
          git commit -m "Update GitHub profile trophies" || exit 0
          git push
          
